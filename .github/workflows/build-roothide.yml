name: Build SafariPlus (iOS 17 / RootHide)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/ios17-roothide-arm64e
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: roothide
      TARGET: iphone:clang:17.5:15.0
      ARCHS: arm64e
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build utilities
        run: |
          brew update
          brew install dpkg ldid make

      - name: Install RootHide Theos
        run: |
          git clone --depth 1 https://github.com/roothide/theos.git "$THEOS"
          test -f "$THEOS/makefiles/common.mk"
          mkdir -p "$THEOS/sdks"

      - name: Install iOS SDK
        run: |
          git clone --depth 1 https://github.com/Tonwalter888/iOS-SDKs.git "$RUNNER_TEMP/iOS-SDKs"
          SDK_PATH="$RUNNER_TEMP/iOS-SDKs/iPhoneOS17.5.sdk"
          if [ ! -d "$SDK_PATH" ]; then
            echo "::error::Pinned iPhoneOS17.5.sdk was not found in Tonwalter888/iOS-SDKs"
            find "$RUNNER_TEMP/iOS-SDKs" -maxdepth 3 -type d | head -100
            exit 1
          fi
          cp -R "$SDK_PATH" "$THEOS/sdks/"
          echo "Installed SDK: $SDK_PATH"
          ls -1 "$THEOS/sdks"

      - name: Install required tweak libraries
        run: |
          git clone --depth 1 https://github.com/opa334/libSandy.git "$RUNNER_TEMP/libSandy"
          (cd "$RUNNER_TEMP/libSandy" && chmod +x install_to_theos.sh && ./install_to_theos.sh)
          git clone --depth 1 https://github.com/opa334/libundirect.git "$RUNNER_TEMP/libundirect"
          (cd "$RUNNER_TEMP/libundirect" && chmod +x install_to_theos.sh && ./install_to_theos.sh)

      - name: Prepare WebKit headers
        run: |
          chmod +x ./get_webkit.sh
          ./get_webkit.sh
          test -f .WebKit/usr/local/include/wtf/RefPtr.h

      - name: Validate project configuration
        run: |
          test -f Makefile
          test -f control
          test -d MobileSafari
          test -d WebContent
          test -d SpringBoard
          test -d Preferences
          grep -q 'Architecture: iphoneos-arm64e' control
          grep -q 'ARCHS = arm64e' Makefile
          grep -q 'TARGET = iphone:clang:17.5:15.0' Makefile
          echo "Project structure and requested arm64e configuration found."

      - name: Build package
        run: |
          set -o pipefail
          make package FINALPACKAGE=1 NO_DEPENDENCIES=1 2>&1 | tee "$RUNNER_TEMP/safariplus-build.log"

      - name: Verify Debian package
        run: |
          set -e
          DEB_COUNT="$(find . -type f -name '*.deb' -not -path './.git/*' | wc -l | tr -d ' ')"
          if [ "$DEB_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one .deb, found $DEB_COUNT"
            find . -type f -name '*.deb' -print
            exit 1
          fi
          DEB="$(find . -type f -name '*.deb' -not -path './.git/*' | head -n 1)"
          dpkg-deb --info "$DEB"
          dpkg-deb --field "$DEB" Architecture | grep -Fx 'iphoneos-arm64e'
          dpkg-deb --contents "$DEB" | tee "$RUNNER_TEMP/package-contents.txt"
          if dpkg-deb --contents "$DEB" | grep -qE '(^|[[:space:]])(./)?var/jb(/|$)'; then
            echo "::error::RootHide package unexpectedly contains /var/jb"
            exit 1
          fi
          mkdir -p artifacts
          cp "$DEB" artifacts/

      - name: Upload package and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SafariPlus-iOS17-RootHide-arm64e
          path: |
            artifacts/*.deb
            ${{ runner.temp }}/safariplus-build.log
          if-no-files-found: warn
